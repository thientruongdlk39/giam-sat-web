name: Giám sát web
# Kiểm các web của TTM mỗi 10 phút từ máy của GitHub (bên ngoài máy chủ web). Không vào được → báo Telegram.
# Cài ngày 09/11/2026. Danh sách địa chỉ + khoá Telegram: Settings → Secrets and variables → Actions (DANH_SACH_URL, TG_BOT_TOKEN, TG_CHAT_ID).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      thu:
        description: "Gửi tin thử lên Telegram"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: giam-sat
  cancel-in-progress: false
jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Lấy trạng thái lần trước
        uses: actions/cache/restore@v4
        with:
          path: trang-thai.txt
          key: trang-thai-${{ github.run_id }}
          restore-keys: trang-thai-
      - name: Kiểm các web
        env:
          DANH_SACH_URL: ${{ secrets.DANH_SACH_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          THU: ${{ inputs.thu || false }}
        run: bash kiem.sh
      - name: Lưu trạng thái
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trang-thai.txt
          key: trang-thai-${{ github.run_id }}
      - name: Giữ lịch chạy (GitHub tự tắt lịch của kho không có hoạt động 60 ngày)
        if: always()
        run: |
          CUOI=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - CUOI )) -gt $(( 45 * 86400 )) ]; then
            date -u +%F > con-song.txt
            git config user.name "giam-sat-bot"
            git config user.email "giam-sat-bot@users.noreply.github.com"
            git add con-song.txt && git commit -qm "Giữ lịch giám sát chạy" && git push -q
          fi
